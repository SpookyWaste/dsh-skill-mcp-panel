name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  # fork 的 Actions 默认关闭，开启后推送不会重放，用这个入口手动跑一次验证。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # 测试套件以 Windows 绝对路径（D:\...）作夹具，并依赖 "\" 作分隔符的折叠语义，
    # 在 POSIX 下会直接失败，因此固定 windows-latest；要换 ubuntu 得先把夹具改成平台无关。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 仓库刻意不跟踪 lockfile（.gitignore 里有 package-lock.json），检出后没有 lockfile，
      # 所以这里必须用 npm install；npm ci 会以 EUSAGE 直接失败。
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      # 仓库提交了 lib/ 产物以便 Git 直装，漂移意味着消费者会拿到与源码不符的构建。
      - name: Verify committed lib/ matches src/
        run: git diff --exit-code -- lib/
      - name: Run test suites
        run: npm test